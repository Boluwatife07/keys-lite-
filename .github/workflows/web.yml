# Builds the Flutter app for the web and publishes it to GitHub Pages on
# every push. One-time setup: Settings > Pages > Source: GitHub Actions.
# The server address comes from the API_BASE_URL repository variable
# (Settings > Secrets and variables > Actions > Variables), with the Render
# default below.
name: Web app

on:
  push:
    branches: [claude/hopeful-mccarthy-vdo9v6, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get
      - run: >
          flutter build web --release --no-web-resources-cdn
          --base-href "/${{ github.event.repository.name }}/"
          --dart-define=API_BASE_URL=${{ vars.API_BASE_URL || 'https://keys-lite-api.onrender.com' }}
      # Deep links (for example /keys-lite-/invite/...) load the app too.
      - run: cp build/web/index.html build/web/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
