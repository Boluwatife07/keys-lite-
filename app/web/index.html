<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="keys_lite">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>keys_lite</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #FFD02F; }
    /* The app lives in this box. Its height follows the part of the screen
       the keyboard doesn't cover, so fields move up above the keyboard. */
    #app { position: fixed; top: 0; left: 0; right: 0; height: 100%; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    (function () {
      var vv = window.visualViewport;
      if (!vv) return;
      var app = document.getElementById('app');
      function fit() {
        app.style.height = vv.height + 'px';
        // iPhone Safari scrolls the page up when the keyboard opens; undo it
        // so the app stays pinned to the top of the screen.
        if (window.scrollY !== 0) window.scrollTo(0, 0);
      }
      vv.addEventListener('resize', fit);
      vv.addEventListener('scroll', fit);
      fit();
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
